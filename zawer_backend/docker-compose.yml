services:
  backend: &backend
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zawer_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - zawer_network

  # Same backend, but pointed at the local mongo container below instead of
  # the MONGO_URI in .env (Atlas users just use "backend").
  # `environment` takes precedence over `env_file`, so .env still supplies JWT_SECRET.
  # Run with: docker compose up -d backend-local   (starts mongo too)
  backend-local:
    <<: *backend
    container_name: zawer_backend_local
    profiles:
      - local-db
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/zawer
    depends_on:
      - mongo

  # Optional local MongoDB service for offline / isolated development
  mongo:
    image: mongo:7-jammy
    container_name: zawer_mongo
    restart: unless-stopped
    profiles:
      - local-db
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - zawer_network

networks:
  zawer_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
